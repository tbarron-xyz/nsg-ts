<!DOCTYPE html>
<html>
    <head>
            <script src="https://cdn.plot.ly/plotly-4.0.0.min.js" charset="utf-8"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.2.16/cytoscape.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/systemjs/0.21.4/system-production.js"></script>
        <script src="./main.js"></script>
        <script>
            System.config({
                map: {
                    cytoscape: 'https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.2.16/cytoscape.min.js',
                }
            })
            System.import('browser/main');
        </script>
    </head>

    <body>
        <div>
            Generators
            <input type="text" id="input1" value="9" autocomplete="off" />
            <input type="text" id="input2" value="43" autocomplete="off" />
            <input type="text" id="input3" value="47" autocomplete="off" />
            <input type="text" id="input4" autocomplete="off" />
        </div>
        <div>
            Element
            <input type="text" id="element-input" autocomplete="off" />
            Catenary degree: <input disabled type="text" id="catenary-input" />
        </br>
        </div>
        <div>
            <input type="checkbox" id="euclidean-checkbox" autocomplete="off" /> Use Euclidean (checked) vs classical (unchecked)
            <br/>
            <input type="checkbox" id="collapse3-checkbox" /> Collapse 3rd dim
            <br/>
            <input type="button" id="explode-button">Explode</input>
        </div>
        <div>
            Controls: a/z, s/x, d/c, f/v = up/down by generator 1, 2, 3, 4
        </div>
        <div style="width: 100%; height: 80%;" id="plotly-container">

        </div>
        <pre id="catenary-table"></pre>
    </body>
</html>
